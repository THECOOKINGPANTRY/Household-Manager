<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333533">
  <title>Tasks | Household Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="main">

    <div class="mobile-topbar">
      <div class="mobile-brand">
        <img src="House_Manager_Logo.png" alt="Household Manager">
        <span class="mobile-brand-name">Household Manager</span>
      </div>
      <a href="settings.html" class="mobile-top-action">⚙</a>
    </div>

    <header class="page-header">
      <div>
        <h1 class="page-title">Tasks</h1>
        <p class="page-subtitle">Stay on top of household jobs and responsibilities.</p>
      </div>
    </header>

    <button class="mobile-add-button" onclick="openSheet('taskSheet')">
      <span>+</span> Add Task
    </button>

    <section class="quick-summary">
      <div class="mini-summary">
        <span>Outstanding</span>
        <strong id="taskCount">0</strong>
      </div>
      <div class="mini-summary">
        <span>Completed</span>
        <strong id="completedTaskCount">0</strong>
      </div>
    </section>

    <section class="task-filters">
      <button class="filter-button active" onclick="filterTasks('all', this)">All</button>
      <button class="filter-button" onclick="filterTasks('active', this)">Active</button>
      <button class="filter-button" onclick="filterTasks('completed', this)">Done</button>
    </section>

    <section class="data-list" id="taskList"></section>

  </main>
</div>

<div class="sheet-overlay" id="taskSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <div>
        <div class="sheet-title">Add Task</div>
        <div class="sheet-subtitle">Create a new household task.</div>
      </div>
      <button class="sheet-close" onclick="closeSheet('taskSheet')">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">Task</label>
      <input id="taskName" class="form-control" type="text" placeholder="e.g. Clean the kitchen">
    </div>

    <div class="form-group">
      <label class="form-label">Assigned To</label>
      <input id="taskPerson" class="form-control" type="text" placeholder="e.g. James">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Due Date</label>
        <input id="taskDue" class="form-control" type="date">
      </div>

      <div class="form-group">
        <label class="form-label">Priority</label>
        <select id="taskPriority" class="form-control">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary btn-large" onclick="addTask(); closeSheet('taskSheet')">
      Add Task
    </button>
  </div>
</div>

<nav class="mobile-header">
  <a href="index.html" data-page="index.html"><span class="mobile-icon">⌂</span><span>Home</span></a>
  <a href="shopping.html" data-page="shopping.html"><span class="mobile-icon">🛒</span><span>Shopping</span></a>
  <a href="tasks.html" data-page="tasks.html"><span class="mobile-icon">✓</span><span>Tasks</span></a>
  <a href="events.html" data-page="events.html"><span class="mobile-icon">📅</span><span>Events</span></a>
  <a href="spending.html" data-page="spending.html"><span class="mobile-icon">💰</span><span>Spending</span></a>
  <a href="settings.html" data-page="settings.html"><span class="mobile-icon">⚙</span><span>Settings</span></a>
</nav>

<script src="script.js"></script>
</body>
</html>
