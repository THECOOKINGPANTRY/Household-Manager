<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333533">
  <title>Household Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <main class="main">
    <div class="mobile-topbar">
      <div class="mobile-brand">
        <img src="House_Manager_Logo.png" alt="Household Manager">
        <span class="mobile-brand-name">Household Manager</span>
      </div>
      <a href="settings.html" class="mobile-top-action" aria-label="Settings">⚙</a>
    </div>

    <header class="page-header">
      <div>
        <h1 class="page-title">Good afternoon</h1>
        <p class="page-subtitle">
          Here's what's happening in <strong class="household-name">My Household</strong>.
        </p>
      </div>
    </header>

    <section class="dashboard-grid">
      <div class="card yellow stat-card">
        <div class="stat-icon">✓</div>
        <div class="stat-label">Tasks</div>
        <div class="stat-number" id="dashboardTasks">0</div>
      </div>

      <div class="card stat-card">
        <div class="stat-icon">🛒</div>
        <div class="stat-label">Shopping</div>
        <div class="stat-number" id="dashboardShopping">0</div>
      </div>

      <div class="card stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-label">Events</div>
        <div class="stat-number" id="dashboardEvents">0</div>
      </div>

      <div class="card dark stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-label">Spending</div>
        <div class="stat-number" id="dashboardSpending">$0.00</div>
      </div>
    </section>

    <section class="dashboard-columns">
      <div class="card">
        <div class="card-heading-row">
          <div class="card-title">Outstanding Tasks</div>
          <a href="tasks.html" class="text-link">View all</a>
        </div>
        <div class="section-list" id="dashboardTaskList"></div>
      </div>

      <div class="card">
        <div class="card-heading-row">
          <div class="card-title">Upcoming Events</div>
          <a href="events.html" class="text-link">View all</a>
        </div>
        <div class="section-list" id="dashboardEventList"></div>
      </div>
    </section>
  </main>
</div>

<nav class="mobile-header">
  <a href="index.html" data-page="index.html">
    <span class="mobile-icon">⌂</span>
    <span>Home</span>
  </a>
  <a href="shopping.html" data-page="shopping.html">
    <span class="mobile-icon">🛒</span>
    <span>Shopping</span>
  </a>
  <a href="tasks.html" data-page="tasks.html">
    <span class="mobile-icon">✓</span>
    <span>Tasks</span>
  </a>
  <a href="events.html" data-page="events.html">
    <span class="mobile-icon">📅</span>
    <span>Events</span>
  </a>
  <a href="spending.html" data-page="spending.html">
    <span class="mobile-icon">💰</span>
    <span>Spending</span>
  </a>
  <a href="settings.html" data-page="settings.html">
    <span class="mobile-icon">⚙</span>
    <span>Settings</span>
  </a>
</nav>

<script src="script.js"></script>
</body>
</html>
