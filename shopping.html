<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333533">
  <title>Shopping | Household Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <main class="main">

      <div class="mobile-topbar">
        <div class="mobile-brand">
          <img src="House_Manager_Logo.png" alt="Household Manager">

          <div>
            <div class="mobile-brand-name">Household Manager</div>

            <div class="mobile-brand-subtitle household-name">
              My Household
            </div>
          </div>
        </div>

        <a
          href="settings.html"
          class="mobile-top-action"
          aria-label="Settings"
        >
          <img src="settings_dark_thick.png" alt="">
        </a>
      </div>

      <header class="page-header">
        <div class="eyebrow">HOUSEHOLD</div>

        <h1 class="page-title">
          Shopping
        </h1>

        <p class="page-subtitle">
          Keep track of everything your household needs.
        </p>
      </header>

      <section class="shopping-summary">

        <div class="shopping-summary-main">

          <div>
            <div class="shopping-summary-label">
              Items to buy
            </div>

            <div
              class="shopping-summary-number"
              id="shoppingRemainingCount"
            >
              0
            </div>
          </div>

          <div class="shopping-summary-icon">
            <img src="shopping_dark_thin.png" alt="">
          </div>

        </div>

        <div class="shopping-summary-stats">

          <div class="shopping-summary-stat">
            <span>Total</span>
            <strong id="shoppingTotalCount">0</strong>
          </div>

          <div class="shopping-summary-divider"></div>

          <div class="shopping-summary-stat">
            <span>Completed</span>
            <strong id="shoppingCompletedCount">0</strong>
          </div>

        </div>

      </section>

      <button
        type="button"
        class="mobile-add-button"
        onclick="openSheet('shoppingSheet')"
      >
        <img src="plus_dark_thin.png" alt="">
        <span>Add Shopping Item</span>
      </button>

      <section class="shopping-filters">

        <button
          type="button"
          class="filter-button active"
          onclick="filterShopping('all', this)"
        >
          All
        </button>

        <button
          type="button"
          class="filter-button"
          onclick="filterShopping('remaining', this)"
        >
          Remaining
        </button>

        <button
          type="button"
          class="filter-button"
          onclick="filterShopping('completed', this)"
        >
          Completed
        </button>

      </section>

      <div class="category-scroll">

        <button
          type="button"
          class="category-button active"
          onclick="filterShoppingCategory('all', this)"
        >
          <img src="shopping_dark_thin.png" alt="">
          <span>All</span>
        </button>

        <button
          type="button"
          class="category-button"
          onclick="filterShoppingCategory('Groceries', this)"
        >
          <img src="food_dark_thin.png" alt="">
          <span>Groceries</span>
        </button>

        <button
          type="button"
          class="category-button"
          onclick="filterShoppingCategory('Household', this)"
        >
          <img src="home_dark_thin.png" alt="">
          <span>Household</span>
        </button>

        <button
          type="button"
          class="category-button"
          onclick="filterShoppingCategory('Cleaning', this)"
        >
          <img src="checkbox_dark_thin.png" alt="">
          <span>Cleaning</span>
        </button>

        <button
          type="button"
          class="category-button"
          onclick="filterShoppingCategory('Bathroom', this)"
        >
          <img src="home_dark_thin.png" alt="">
          <span>Bathroom</span>
        </button>

        <button
          type="button"
          class="category-button"
          onclick="filterShoppingCategory('Pet', this)"
        >
          <img src="people_dark_thin.png" alt="">
          <span>Pet</span>
        </button>

        <button
          type="button"
          class="category-button"
          onclick="filterShoppingCategory('Other', this)"
        >
          <img src="more_dark_thin.png" alt="">
          <span>Other</span>
        </button>

      </div>

      <section class="shopping-section">

        <div class="shopping-section-heading">

          <div>
            <div
              class="shopping-section-title"
              id="shoppingSectionTitle"
            >
              Shopping List
            </div>

            <div class="shopping-section-subtitle">
              Things your household needs
            </div>
          </div>

          <span
            class="shopping-section-count"
            id="visibleShoppingCount"
          >
            0
          </span>

        </div>

        <div
          class="shopping-list"
          id="shoppingList"
        ></div>

      </section>

      <button
        type="button"
        class="clear-completed-button"
        id="clearCompletedButton"
        onclick="clearCompletedShopping()"
      >
        <img src="bin_dark_thin.png" alt="">
        <span>Clear Completed</span>
      </button>

    </main>

  </div>

  <div
    class="sheet-overlay"
    id="shoppingSheet"
  >

    <div class="sheet">

      <div class="sheet-handle"></div>

      <div class="sheet-header">

        <div>
          <div class="sheet-title">
            Add Shopping Item
          </div>

          <div class="sheet-subtitle">
            Add something your household needs.
          </div>
        </div>

        <button
          type="button"
          class="sheet-close"
          onclick="closeSheet('shoppingSheet')"
          aria-label="Close"
        >
          <span aria-hidden="true">×</span>
        </button>

      </div>

      <div class="form-group">

        <label
          class="form-label"
          for="shoppingName"
        >
          Item
        </label>

        <input
          id="shoppingName"
          class="form-control"
          type="text"
          placeholder="e.g. Milk"
          autocomplete="off"
        >

      </div>

      <div class="form-row">

        <div class="form-group">

          <label
            class="form-label"
            for="shoppingQuantity"
          >
            Quantity
          </label>

          <input
            id="shoppingQuantity"
            class="form-control"
            type="text"
            placeholder="e.g. 2"
            autocomplete="off"
          >

        </div>

        <div class="form-group">

          <label
            class="form-label"
            for="shoppingCategory"
          >
            Category
          </label>

          <select
            id="shoppingCategory"
            class="form-control"
          >
            <option value="Groceries">Groceries</option>
            <option value="Household">Household</option>
            <option value="Cleaning">Cleaning</option>
            <option value="Bathroom">Bathroom</option>
            <option value="Pet">Pet</option>
            <option value="Other">Other</option>
          </select>

        </div>

      </div>

      <button
        type="button"
        class="btn btn-primary btn-large"
        id="addShoppingItemButton"
        onclick="addShoppingItem(event)"
      >
        <img src="plus_dark_thin.png" alt="">
        <span>Add Item</span>
      </button>

    </div>

  </div>

  <nav class="mobile-header">

    <a
      href="index.html"
      data-page="index.html"
      aria-label="Home"
    >
      <span class="mobile-icon">
        <img src="home_light_thick.png" alt="">
      </span>
      <span>Home</span>
    </a>

    <a
      href="shopping.html"
      data-page="shopping.html"
      aria-label="Shopping"
    >
      <span class="mobile-icon">
        <img src="shopping_light_thick.png" alt="">
      </span>
      <span>Shopping</span>
    </a>

    <a
      href="tasks.html"
      data-page="tasks.html"
      aria-label="Tasks"
    >
      <span class="mobile-icon">
        <img src="checkbox_light_thick.png" alt="">
      </span>
      <span>Tasks</span>
    </a>

    <a
      href="events.html"
      data-page="events.html"
      aria-label="Events"
    >
      <span class="mobile-icon">
        <img src="calendar_light_thick.png" alt="">
      </span>
      <span>Events</span>
    </a>

    <a
      href="spending.html"
      data-page="spending.html"
      aria-label="Spending"
    >
      <span class="mobile-icon">
        <img src="wallet_light_thick.png" alt="">
      </span>
      <span>Spending</span>
    </a>

    <a
      href="settings.html"
      data-page="settings.html"
      aria-label="Settings"
    >
      <span class="mobile-icon">
        <img src="settings_light_thick.png" alt="">
      </span>
      <span>Settings</span>
    </a>

  </nav>

  <script src="script.js"></script>

</body>
</html>
