<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333533">
  <title>Shopping | Household Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="main">

    <div class="mobile-topbar">
      <div class="mobile-brand">
        <img src="House_Manager_Logo.png" alt="Household Manager">
        <span class="mobile-brand-name">Household Manager</span>
      </div>
      <a href="settings.html" class="mobile-top-action">⚙</a>
    </div>

    <header class="page-header">
      <div>
        <h1 class="page-title">Shopping</h1>
        <p class="page-subtitle">Keep track of everything your household needs.</p>
      </div>
    </header>

    <button class="mobile-add-button" onclick="openSheet('shoppingSheet')">
      <span>+</span> Add Item
    </button>

    <section class="quick-summary">
      <div class="mini-summary">
        <span>Items</span>
        <strong id="shoppingCount">0</strong>
      </div>
      <div class="mini-summary">
        <span>Remaining</span>
        <strong id="shoppingRemaining">0</strong>
      </div>
    </section>

    <section class="data-list" id="shoppingList"></section>

  </main>
</div>

<div class="sheet-overlay" id="shoppingSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <div>
        <div class="sheet-title">Add Shopping Item</div>
        <div class="sheet-subtitle">Add something to your household list.</div>
      </div>
      <button class="sheet-close" onclick="closeSheet('shoppingSheet')">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">Item</label>
      <input id="shoppingName" class="form-control" type="text" placeholder="e.g. Milk">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Quantity</label>
        <input id="shoppingQuantity" class="form-control" type="text" placeholder="1">
      </div>

      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="shoppingCategory" class="form-control">
          <option>Groceries</option>
          <option>Household</option>
          <option>Cleaning</option>
          <option>Bathroom</option>
          <option>Pet</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary btn-large" onclick="addShoppingItem(); closeSheet('shoppingSheet')">
      Add to Shopping List
    </button>
  </div>
</div>

<nav class="mobile-header">
  <a href="index.html" data-page="index.html"><span class="mobile-icon">⌂</span><span>Home</span></a>
  <a href="shopping.html" data-page="shopping.html"><span class="mobile-icon">🛒</span><span>Shopping</span></a>
  <a href="tasks.html" data-page="tasks.html"><span class="mobile-icon">✓</span><span>Tasks</span></a>
  <a href="events.html" data-page="events.html"><span class="mobile-icon">📅</span><span>Events</span></a>
  <a href="spending.html" data-page="spending.html"><span class="mobile-icon">💰</span><span>Spending</span></a>
  <a href="settings.html" data-page="settings.html"><span class="mobile-icon">⚙</span><span>Settings</span></a>
</nav>

<script src="script.js"></script>
</body>
</html>
