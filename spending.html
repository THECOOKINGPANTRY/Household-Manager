<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333533">
  <title>Spending | Household Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="main">

    <div class="mobile-topbar">
      <div class="mobile-brand">
        <img src="House_Manager_Logo.png" alt="Household Manager">
        <span class="mobile-brand-name">Household Manager</span>
      </div>
      <a href="settings.html" class="mobile-top-action">⚙</a>
    </div>

    <header class="page-header">
      <div>
        <h1 class="page-title">Spending</h1>
        <p class="page-subtitle">Keep track of household expenses.</p>
      </div>
    </header>

    <section class="spending-summary">
      <div class="card yellow summary-card">
        <span class="summary-label">Total Spending</span>
        <strong class="money" id="totalSpending">$0.00</strong>
      </div>

      <div class="card summary-card">
        <span class="summary-label">This Month</span>
        <strong class="money" id="monthSpending">$0.00</strong>
      </div>

      <div class="card dark summary-card">
        <span class="summary-label">Average Expense</span>
        <strong class="money" id="averageSpending">$0.00</strong>
      </div>
    </section>

    <button class="mobile-add-button" onclick="openSheet('expenseSheet')">
      <span>+</span> Add Expense
    </button>

    <section class="data-list" id="spendingList"></section>

  </main>
</div>

<div class="sheet-overlay" id="expenseSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <div>
        <div class="sheet-title">Add Expense</div>
        <div class="sheet-subtitle">Record a household expense.</div>
      </div>
      <button class="sheet-close" onclick="closeSheet('expenseSheet')">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">Expense</label>
      <input id="expenseName" class="form-control" type="text" placeholder="e.g. Weekly groceries">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Amount</label>
        <input id="expenseAmount" class="form-control" type="number" step="0.01" min="0" placeholder="0.00">
      </div>

      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="expenseCategory" class="form-control">
          <option>Groceries</option>
          <option>Bills</option>
          <option>Transport</option>
          <option>Entertainment</option>
          <option>Home</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Date</label>
      <input id="expenseDate" class="form-control" type="date">
    </div>

    <button class="btn btn-primary btn-large" onclick="addExpense(); closeSheet('expenseSheet')">
      Add Expense
    </button>
  </div>
</div>

<nav class="mobile-header">
  <a href="index.html" data-page="index.html"><span class="mobile-icon">⌂</span><span>Home</span></a>
  <a href="shopping.html" data-page="shopping.html"><span class="mobile-icon">🛒</span><span>Shopping</span></a>
  <a href="tasks.html" data-page="tasks.html"><span class="mobile-icon">✓</span><span>Tasks</span></a>
  <a href="events.html" data-page="events.html"><span class="mobile-icon">📅</span><span>Events</span></a>
  <a href="spending.html" data-page="spending.html"><span class="mobile-icon">💰</span><span>Spending</span></a>
  <a href="settings.html" data-page="settings.html"><span class="mobile-icon">⚙</span><span>Settings</span></a>
</nav>

<script src="script.js"></script>
</body>
</html>
