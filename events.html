<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333533">
  <title>Events | Household Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="app">
    <main class="main">

      <div class="mobile-topbar">
        <div class="mobile-brand">
          <img src="House_Manager_Logo.png" alt="Household Manager">
          <span class="mobile-brand-name">Household Manager</span>
        </div>

        <a href="settings.html" class="mobile-top-action" aria-label="Settings">
          <i data-lucide="settings"></i>
        </a>
      </div>

      <header class="page-header">
        <div>
          <h1 class="page-title">Events</h1>
          <p class="page-subtitle">Keep track of important household dates.</p>
        </div>
      </header>

      <button class="mobile-add-button" onclick="openSheet('eventSheet')">
        <i data-lucide="plus"></i>
        <span>Add Event</span>
      </button>

      <section class="data-list" id="eventList"></section>

    </main>
  </div>

  <div class="sheet-overlay" id="eventSheet">
    <div class="sheet">
      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <div>
          <div class="sheet-title">Add Event</div>
          <div class="sheet-subtitle">Add an important household date.</div>
        </div>

        <button
          class="sheet-close"
          onclick="closeSheet('eventSheet')"
          aria-label="Close"
        >
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label">Event Name</label>
        <input
          id="eventName"
          class="form-control"
          type="text"
          placeholder="e.g. Family dinner"
        >
      </div>

      <div class="form-group">
        <label class="form-label">Location</label>
        <input
          id="eventLocation"
          class="form-control"
          type="text"
          placeholder="e.g. Home"
        >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input
            id="eventDate"
            class="form-control"
            type="date"
          >
        </div>

        <div class="form-group">
          <label class="form-label">Time</label>
          <input
            id="eventTime"
            class="form-control"
            type="time"
          >
        </div>
      </div>

      <button
        class="btn btn-primary btn-large"
        onclick="addEvent(); closeSheet('eventSheet')"
      >
        <i data-lucide="calendar-plus"></i>
        <span>Add Event</span>
      </button>

    </div>
  </div>

  <nav class="mobile-header">

    <a href="index.html" data-page="index.html">
      <i data-lucide="house" class="mobile-icon"></i>
      <span>Home</span>
    </a>

    <a href="shopping.html" data-page="shopping.html">
      <i data-lucide="shopping-cart" class="mobile-icon"></i>
      <span>Shopping</span>
    </a>

    <a href="tasks.html" data-page="tasks.html">
      <i data-lucide="circle-check" class="mobile-icon"></i>
      <span>Tasks</span>
    </a>

    <a href="events.html" data-page="events.html">
      <i data-lucide="calendar-days" class="mobile-icon"></i>
      <span>Events</span>
    </a>

    <a href="spending.html" data-page="spending.html">
      <i data-lucide="wallet" class="mobile-icon"></i>
      <span>Spending</span>
    </a>

    <a href="settings.html" data-page="settings.html">
      <i data-lucide="settings" class="mobile-icon"></i>
      <span>Settings</span>
    </a>

  </nav>

  <script src="script.js"></script>

  <script>
    if (window.lucide) {
      lucide.createIcons({
        attrs: {
          "stroke-width": 2,
          "stroke-linecap": "round",
          "stroke-linejoin": "round"
        }
      });
    }
  </script>

</body>
</html>
