<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#333533">
  <title>Events | Household Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <main class="main">

      <div class="mobile-topbar">
        <div class="mobile-brand">
          <img src="House_Manager_Logo.png" alt="Household Manager">
          <span class="mobile-brand-name">Household Manager</span>
        </div>

        <a href="settings.html" class="mobile-top-action" aria-label="Settings">
          <img src="settings_dark_thick.png" alt="">
        </a>
      </div>

      <header class="page-header">
        <div>
          <h1 class="page-title">Events</h1>
          <p class="page-subtitle">Keep track of important household dates.</p>
        </div>
      </header>

      <button
        class="mobile-add-button"
        onclick="openSheet('eventSheet')"
      >
        <img src="calendar_dark_thin.png" alt="">
        <span>Add Event</span>
      </button>

      <section class="data-list" id="eventList"></section>

    </main>
  </div>

  <div class="sheet-overlay" id="eventSheet">
    <div class="sheet">

      <div class="sheet-handle"></div>

      <div class="sheet-header">
        <div>
          <div class="sheet-title">Add Event</div>
          <div class="sheet-subtitle">
            Add an important household date.
          </div>
        </div>

        <button
          class="sheet-close"
          onclick="closeSheet('eventSheet')"
          aria-label="Close"
        >
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label" for="eventName">Event Name</label>

        <input
          id="eventName"
          class="form-control"
          type="text"
          placeholder="e.g. Family dinner"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="eventLocation">Location</label>

        <input
          id="eventLocation"
          class="form-control"
          type="text"
          placeholder="e.g. Home"
        >
      </div>

      <div class="form-row">

        <div class="form-group">
          <label class="form-label" for="eventDate">Date</label>

          <input
            id="eventDate"
            class="form-control"
            type="date"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="eventTime">Time</label>

          <input
            id="eventTime"
            class="form-control"
            type="time"
          >
        </div>

      </div>

      <button
        class="btn btn-primary btn-large"
        onclick="addEvent(); closeSheet('eventSheet')"
      >
        <img src="calendar_dark_thin.png" alt="">
        <span>Add Event</span>
      </button>

    </div>
  </div>

  <nav class="mobile-header">

    <a href="index.html" data-page="index.html">
      <span class="mobile-icon">
        <img src="home_dark_thick.png" alt="">
      </span>
      <span>Home</span>
    </a>

    <a href="shopping.html" data-page="shopping.html">
      <span class="mobile-icon">
        <img src="cart_dark_thick.png" alt="">
      </span>
      <span>Shopping</span>
    </a>

    <a href="tasks.html" data-page="tasks.html">
      <span class="mobile-icon">
        <img src="checkbox_dark_thick.png" alt="">
      </span>
      <span>Tasks</span>
    </a>

    <a href="events.html" data-page="events.html">
      <span class="mobile-icon">
        <img src="calendar_dark_thick.png" alt="">
      </span>
      <span>Events</span>
    </a>

    <a href="spending.html" data-page="spending.html">
      <span class="mobile-icon">
        <img src="wallet_dark_thick.png" alt="">
      </span>
      <span>Spending</span>
    </a>

    <a href="settings.html" data-page="settings.html">
      <span class="mobile-icon">
        <img src="settings_dark_thick.png" alt="">
      </span>
      <span>Settings</span>
    </a>

  </nav>

  <script src="script.js"></script>
</body>
</html>
